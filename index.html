<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sideral Audio · MS 760 · Visor 3D</title>
<meta name="description" content="Visor 3D interactivo del parlante Sideral Audio MS 760: vista 360° y despiece de sus componentes internos.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#c98f55; --gold-d:#a8723d; --ink:#e9ecf0; --mute:#9aa1ab; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); }
  :root{ --disp:"Jost","Inter",system-ui,sans-serif; --glass:linear-gradient(160deg, rgba(255,236,196,.55) 0%, rgba(228,176,108,.38) 45%, rgba(190,130,70,.32) 100%); }
  body{ background: radial-gradient(60% 50% at 78% 22%, rgba(110,80,160,.22), transparent 70%), radial-gradient(55% 45% at 18% 78%, rgba(40,90,150,.20), transparent 70%), radial-gradient(120% 90% at 50% 45%, #0b0d1a 0%, #05060d 60%, #010103 100%); }
  #stage{ position:absolute; inset:0; }
  #stage canvas{ display:block; cursor:grab; outline:none; }
  #stage canvas:active{ cursor:grabbing; }
  #labels{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lbl{ position:absolute; left:0; top:0; will-change:transform; white-space:nowrap; font-size:12px; font-weight:600; letter-spacing:.01em; line-height:1;
        background:linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.05) 50%, rgba(222,176,112,.12)); backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4); border:1px solid rgba(255,255,255,.20); border-top-color:rgba(255,255,255,.38); border-radius:3px; padding:8px 13px; color:#f4e6cf;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.4); cursor:pointer; font-family:var(--disp); font-weight:500; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; }
  .lbl.active, .lbl:hover{ background:linear-gradient(180deg, rgba(240,200,140,.34), rgba(214,160,92,.20)); color:#fff6e6; border-color:rgba(238,200,148,.65); box-shadow:inset 0 1px 0 rgba(255,240,215,.5), 0 4px 12px rgba(0,0,0,.4), 0 0 14px rgba(222,170,100,.25); }
  .badge{ position:absolute; left:0; top:0; width:22px; height:22px; border-radius:50%; background:var(--gold); color:#fff; font-size:12px; font-weight:700; display:none;
          align-items:center; justify-content:center; text-align:center; line-height:22px; border:2px solid #fff; box-shadow:0 2px 8px rgba(35,38,42,.25); cursor:pointer; }
  .badge.active{ background:var(--ink); }
  #legend{ position:absolute; left:8px; right:8px; bottom:130px; display:none; grid-template-columns:1fr 1fr; gap:2px 10px; padding:8px 10px; opacity:0; transition:opacity .25s;
           background:rgba(24,26,30,.82); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:12px; border:1px solid rgba(255,255,255,.08); font-size:11.5px; }
  #legend .li{ display:flex; align-items:center; gap:7px; padding:4px 2px; cursor:pointer; font-weight:600; }
  #legend .li i{ font-style:normal; width:18px; height:18px; border-radius:50%; background:var(--gold); color:#fff; display:inline-grid; place-items:center; font-size:10.5px; flex:none; }
  #legend .li.active{ color:var(--gold-d); }
  #leaders{ position:absolute; left:0; top:0; overflow:visible; }
  #leaders .ldr{ fill:none; stroke:var(--gold); stroke-width:1.3; opacity:.9; }
  #leaders .ldr.active{ stroke:var(--gold-d); stroke-width:2; }
  #leaders .dot{ fill:var(--gold); stroke:#fff; stroke-width:2; }

  header{ position:absolute; left:16px; top:14px; display:flex; align-items:center; gap:12px; pointer-events:none; }
  header img{ height:46px; width:auto; display:block; }
  header .t{ line-height:1.15; }
  header .t b{ display:block; font-family:var(--disp); font-weight:500; font-size:13px; letter-spacing:.28em; }
  header .t span{ font-size:12px; color:var(--mute); }

  #bar{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:stretch; gap:8px; padding:10px;
        background:rgba(12,14,24,.50); backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3);
        border:1px solid rgba(255,255,255,.10); border-top-color:rgba(255,255,255,.18); border-radius:4px; box-shadow:0 10px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); max-width:calc(100% - 20px); }
  .row{ display:grid; grid-template-columns:repeat(4, 108px); gap:8px; }
  .row.r1 .slw{ grid-column:3 / span 2; display:flex; align-items:center; padding:0 6px; }
  .row.r1 #btnExplode{ grid-column:1 / span 2; }
  .r3 .zoom{ grid-column:span 2; }
  .zoom{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button{ position:relative; overflow:hidden; font-family:var(--disp); font-size:11px; font-weight:400; letter-spacing:.26em; text-transform:uppercase; color:#f1e4cc; white-space:nowrap;
          background:linear-gradient(180deg, rgba(255,255,255,.17) 0%, rgba(255,255,255,.05) 48%, rgba(222,176,112,.12) 100%);
          backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
          border:1px solid rgba(255,255,255,.20); border-top-color:rgba(255,255,255,.38); border-bottom-color:rgba(255,255,255,.08); border-radius:3px; padding:10px 16px; cursor:pointer; min-height:40px;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.30), 0 4px 14px rgba(0,0,0,.40);
          transition:background .25s,box-shadow .25s,border-color .25s,transform .12s,color .25s; }
  button::before{ content:""; position:absolute; left:0; right:0; top:0; height:42%; background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,0)); pointer-events:none; }
  button:hover{ background:linear-gradient(180deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,.08) 48%, rgba(228,184,120,.20) 100%); border-color:rgba(236,200,150,.55); border-top-color:rgba(255,236,205,.7); color:#fff3dd; }
  button:active{ transform:translateY(1px); box-shadow:inset 0 1px 3px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.4); }
  button.on, #btnExplode.on{ background:linear-gradient(180deg, rgba(240,200,140,.34) 0%, rgba(214,160,92,.20) 55%, rgba(200,140,70,.26) 100%); border-color:rgba(238,200,148,.65); border-top-color:rgba(255,232,196,.85); color:#fff6e6;
          box-shadow:inset 0 1px 0 rgba(255,240,215,.5), inset 0 -1px 0 rgba(0,0,0,.28), 0 4px 14px rgba(0,0,0,.40), 0 0 16px rgba(222,170,100,.28); }
  #btnExplode{ letter-spacing:.34em; font-size:12px; }
  @keyframes pulse{ 0%,100%{ opacity:.45; transform:scale(.85); } 50%{ opacity:1; transform:scale(1.15); } }
  .grp{ display:flex; gap:6px; align-items:center; }
  .sep{ width:1px; align-self:stretch; background:rgba(255,255,255,.14); margin:2px 2px; }
  #explodeRange{ width:100%; accent-color:#d9b27c; }
  .ico{ min-width:0; padding:8px 0; font-size:18px; line-height:1; letter-spacing:0; }

  #infoCard{ position:absolute; left:16px; top:78px; width:min(280px, calc(100% - 32px)); background:rgba(14,16,28,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,225,175,.35);
             border-radius:6px; padding:14px 16px 14px; box-shadow:0 8px 30px rgba(35,38,42,.14); opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .2s, transform .2s; }
  #infoCard.show{ opacity:1; transform:none; pointer-events:auto; }
  #infoCard h3{ margin:0 22px 6px 0; font-family:var(--disp); font-weight:500; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#ffe2b4; }
  #infoCard p{ margin:0; font-size:13px; line-height:1.45; color:#c4c9d2; }
  #cardClose{ position:absolute; right:6px; top:6px; min-height:0; padding:2px 8px; border:0; background:transparent; font-size:18px; color:var(--mute); }
  #hint{ position:absolute; right:16px; top:18px; font-size:12px; color:var(--mute); pointer-events:none; text-align:right; }
  #loading{ position:absolute; inset:0; display:grid; place-items:center; font-size:13px; color:var(--mute); letter-spacing:.08em; transition:opacity .4s; background:#05060d; }
  body.ready #loading{ opacity:0; pointer-events:none; }
  @media (max-width:620px){
    header img{ height:36px; } #hint{ display:none; } #bar{ bottom:8px; gap:6px; padding:6px; width:calc(100% - 16px); } .row{ grid-template-columns:repeat(4, 1fr); gap:6px; }
    button{ padding:8px 4px; font-size:9.5px; letter-spacing:.14em; min-height:38px; } #explodeRange{ width:90px; } #infoCard{ top:62px; }
    .lbl{ font-size:10.5px; padding:6px 9px; } .badge{ display:flex; } #legend{ display:grid; }
  }
</style>
</head>

<div id="stage"></div>
<div id="labels"></div>
<header>
  <img alt="Sideral Audio" src="" id="brandLogo">
  <div class="t"><b>MS 760</b><span>Vista 360° · Despiece interactivo</span></div>
</header>
<div id="hint">Arrastra para girar · rueda o pellizco para zoom<br>Toca una pieza para ver su detalle</div>

<div id="legend"></div>

</div>
